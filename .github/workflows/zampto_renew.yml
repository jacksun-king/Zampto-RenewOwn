name: Zampto-Renew

on:
  workflow_dispatch:
  schedule:
    # 每 3.5 小时执行一次（cron 无法表达 3.5h，用 7 个时间点近似均匀）
    # 北京时间: 00:00 / 03:30 / 07:00 / 10:30 / 14:00 / 17:30 / 21:00
    # UTC:       16:00 / 19:30 / 23:00 / 02:30 / 06:00 / 09:30 / 13:00
    - cron: '0 16,23,6,13 * * *'
    - cron: '30 19,2,9 * * *'

jobs:
  run_zampto_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📂 检出仓库（脚本已在根目录）
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛠️ 安装系统依赖（Ubuntu runner 已自带 Chrome）
        timeout-minutes: 10
        run: |
          # runner 已预装 google-chrome-stable + Xvfb，尽量不依赖 apt；
          # 缺 Xvfb 时才尝试多源 apt（azure→阿里→清华→官方），每源 75s 超时，装不上明确报错
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "✅ Xvfb / xvfb-run 已预装，跳过 apt 安装"
            exit 0
          fi
          install_deps() {
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 \
              xvfb xdotool
          }
          set_apt() {
            MIRROR_="$1"
            sudo bash -c 'M='"$MIRROR_"'; source /etc/os-release && printf "deb http://%s/ubuntu/ %s main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-updates main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-security main restricted universe multiverse\n" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" > /etc/apt/sources.list'
          }
          for MIRROR in azure.archive.ubuntu.com mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn archive.ubuntu.com; do
            echo "--- 尝试 apt 源: $MIRROR ---"
            set_apt "$MIRROR"
            if timeout 75 bash -c "$(declare -f install_deps); install_deps"; then
              echo "✅ 使用 $MIRROR 安装成功"
              exit 0
            fi
            echo "⚠️ $MIRROR 失败，换下一个源"
          done
          echo "❌ 所有 apt 源均不可用，无法安装 Xvfb"
          command -v Xvfb || echo "Xvfb 缺失：脚本需要 xvfb-run 才能运行"
          exit 1

      - name: ✅ 验证系统 Chrome
        run: |
          google-chrome --version
          which google-chrome

      - name: 💾 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-seleniumbase-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-seleniumbase-

      - name: 🐍 安装 Python 依赖
        run: |
          pip install --cache-dir ~/.cache/pip -i https://pypi.tuna.tsinghua.edu.cn/simple seleniumbase requests[socks] python-xlib
          seleniumbase install chromedriver || true

      - name: 🛡️ 启动代理转发（sing-box 统一支持 vless/vmess/trojan/hysteria2/tuic/anytls/socks/http）
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          LOCAL_PROXY_PORT: "1080"
        run: |
          set -e
          PROXY="$GOST_PROXY"
          LOCAL_MIXED="socks5://127.0.0.1:${LOCAL_PROXY_PORT}"
          echo "🌐 使用 sing-box 统一解析节点链接: $PROXY"
          VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "📦 sing-box 版本: $VER"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/${VER}/sing-box-${VER#v}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${VER#v}-linux-amd64.tar.gz"
          SBBIN=$(find . -maxdepth 3 -name sing-box -type f | head -1)
          chmod +x "$SBBIN"
          python3 parse_proxy.py
          echo "📝 singbox_config.json:"
          cat singbox_config.json
          nohup "$SBBIN" run -c singbox_config.json > singbox.log 2>&1 &
          sleep 5
          echo "📝 sing-box 启动日志:"
          tail -n 60 singbox.log || true
          echo "✅ sing-box 已启动于 $LOCAL_MIXED"
          echo "✅ 代理就绪，测试出口 IP..."
          curl -s --connect-timeout 10 --max-time 15 -x "$LOCAL_MIXED" https://api.ipify.org | sed 's/\([0-9]*\.[0-9]*\.\)[0-9]*\.[0-9]*/\1**.**/g' && echo "" || (echo "⚠️ 代理连通测试失败"; exit 1)

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          ZAMPTO_ACCOUNT: ${{ secrets.ZAMPTO_ACCOUNT }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          TARGET_SERVERS: ${{ secrets.TARGET_SERVERS }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          ZAMPTO_APP_ID: ${{ secrets.ZAMPTO_APP_ID }}
          ZAMPTO_DOMAIN: ${{ secrets.ZAMPTO_DOMAIN }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python zampto_renew.py

      - name: 📸 上传调试截图和代理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.png
            singbox.log
            singbox_config.json
          retention-days: 3
