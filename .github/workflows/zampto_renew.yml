name: Zampto-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00

jobs:
  run_zampto_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📂 检出仓库（脚本已在根目录）
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛠️ 安装系统依赖（Ubuntu runner 已自带 Chrome）
        timeout-minutes: 10
        run: |
          # runner 已预装 google-chrome-stable + Xvfb，尽量不依赖 apt；
          # 缺 Xvfb 时才尝试多源 apt（azure→阿里→清华→官方），每源 75s 超时，装不上明确报错
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "✅ Xvfb / xvfb-run 已预装，跳过 apt 安装"
            exit 0
          fi
          install_deps() {
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 \
              xvfb xdotool
          }
          set_apt() {
            MIRROR_="$1"
            sudo bash -c 'M='"$MIRROR_"'; source /etc/os-release && printf "deb http://%s/ubuntu/ %s main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-updates main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-security main restricted universe multiverse\n" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" > /etc/apt/sources.list'
          }
          for MIRROR in azure.archive.ubuntu.com mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn archive.ubuntu.com; do
            echo "--- 尝试 apt 源: $MIRROR ---"
            set_apt "$MIRROR"
            if timeout 75 bash -c "$(declare -f install_deps); install_deps"; then
              echo "✅ 使用 $MIRROR 安装成功"
              exit 0
            fi
            echo "⚠️ $MIRROR 失败，换下一个源"
          done
          echo "❌ 所有 apt 源均不可用，无法安装 Xvfb"
          command -v Xvfb || echo "Xvfb 缺失：脚本需要 xvfb-run 才能运行"
          exit 1

      - name: ✅ 验证系统 Chrome
        run: |
          google-chrome --version
          which google-chrome

      - name: 💾 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-seleniumbase-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-seleniumbase-

      - name: 🐍 安装 Python 依赖
        run: |
          pip install --cache-dir ~/.cache/pip -i https://pypi.tuna.tsinghua.edu.cn/simple seleniumbase requests[socks] python-xlib
          seleniumbase install chromedriver || true

      - name: 🛡️ 启动代理转发（支持 GOST / Hysteria2 节点链接）
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          LOCAL_PROXY_PORT: "1080"
        run: |
          set -e
          PROXY="$GOST_PROXY"
          LOCAL_MIXED="socks5://127.0.0.1:${LOCAL_PROXY_PORT}"
          if [[ "$PROXY" == hysteria2://* ]] || [[ "$PROXY" == hy2://* ]]; then
            echo "🌐 检测到 Hysteria2 节点链接，使用 hysteria 客户端启动本地 SOCKS5"
            VER=$(curl -s https://api.github.com/repos/apernet/hysteria/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            echo "📦 Hysteria 版本: $VER"
            wget -q "https://github.com/apernet/hysteria/releases/download/${VER}/hysteria-linux-amd64"
            chmod +x hysteria-linux-amd64
            python3 parse_hy2.py
            echo "📝 hy2_config.json:"
            cat hy2_config.json
            nohup ./hysteria-linux-amd64 client -c hy2_config.json > hy2.log 2>&1 &
            sleep 6
            echo "📝 hysteria 启动日志前 80 行:"
            tail -n 80 hy2.log || true
            echo "✅ Hysteria2 客户端已启动于 $LOCAL_MIXED"
          else
            echo "🌐 使用 GOST 转发上游代理: $PROXY"
            VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
            echo "📦 GOST 版本: $VERSION"
            wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
            tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
            chmod +x gost
            nohup ./gost -L "mixed://:${LOCAL_PROXY_PORT}" -F "$PROXY" > gost.log 2>&1 &
            sleep 3
            echo "📝 gost 启动日志:"
            cat gost.log || true
            echo "✅ GOST 已启动于 $LOCAL_MIXED"
          fi
          echo "✅ 代理就绪，测试出口 IP..."
          curl -s --connect-timeout 10 --max-time 15 -x "$LOCAL_MIXED" https://api.ipify.org | sed 's/\([0-9]*\.[0-9]*\.\)[0-9]*\.[0-9]*/\1**.**/g' && echo "" || (echo "⚠️ 代理连通测试失败"; exit 1)

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          ZAMPTO_ACCOUNT: ${{ secrets.ZAMPTO_ACCOUNT }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          TARGET_SERVERS: ${{ secrets.TARGET_SERVERS }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          ZAMPTO_APP_ID: ${{ secrets.ZAMPTO_APP_ID }}
          ZAMPTO_DOMAIN: ${{ secrets.ZAMPTO_DOMAIN }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python zampto_renew.py

      - name: 📸 上传调试截图和代理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.png
            hy2.log
            gost.log
            hy2_config.json
          retention-days: 3
