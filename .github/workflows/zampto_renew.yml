name: Zampto-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # 每 3 小时一次（UTC 00/03/06/09/12/15/18/21 = 北京 08/11/14/17/20/23/02/05）

jobs:
  run_zampto_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📂 检出仓库（脚本已在根目录）
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛠️ 安装系统依赖（Ubuntu runner 已自带 Chrome）
        timeout-minutes: 10
        run: |
          # runner 已预装 google-chrome-stable + Xvfb，尽量不依赖 apt；
          # 缺 Xvfb 时才尝试多源 apt（azure→阿里→清华→官方），每源 75s 超时，装不上明确报错
          if command -v Xvfb >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1; then
            echo "✅ Xvfb / xvfb-run 已预装，跳过 apt 安装"
            exit 0
          fi
          install_deps() {
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 \
              xvfb xdotool
          }
          set_apt() {
            MIRROR_="$1"
            sudo bash -c 'M='"$MIRROR_"'; source /etc/os-release && printf "deb http://%s/ubuntu/ %s main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-updates main restricted universe multiverse\ndeb http://%s/ubuntu/ %s-security main restricted universe multiverse\n" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" "$M" "$VERSION_CODENAME" > /etc/apt/sources.list'
          }
          for MIRROR in azure.archive.ubuntu.com mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn archive.ubuntu.com; do
            echo "--- 尝试 apt 源: $MIRROR ---"
            set_apt "$MIRROR"
            if timeout 75 bash -c "$(declare -f install_deps); install_deps"; then
              echo "✅ 使用 $MIRROR 安装成功"
              exit 0
            fi
            echo "⚠️ $MIRROR 失败，换下一个源"
          done
          echo "❌ 所有 apt 源均不可用，无法安装 Xvfb"
          command -v Xvfb || echo "Xvfb 缺失：脚本需要 xvfb-run 才能运行"
          exit 1

      - name: ✅ 验证系统 Chrome
        run: |
          google-chrome --version
          which google-chrome

      - name: 💾 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-seleniumbase-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-seleniumbase-

      - name: 🐍 安装 Python 依赖
        run: |
          pip install --cache-dir ~/.cache/pip seleniumbase requests[socks] python-xlib pyyaml || \
          pip install --cache-dir ~/.cache/pip -i https://pypi.tuna.tsinghua.edu.cn/simple seleniumbase requests[socks] python-xlib pyyaml
          seleniumbase install chromedriver || true

      - name: 🛡️ 启动代理转发（mihomo + 自动选住宅 IP 节点）
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          LOCAL_PROXY_PORT: "1080"
        run: |
          set -e
          PROXY="$GOST_PROXY"
          LOCAL_MIXED="socks5://127.0.0.1:${LOCAL_PROXY_PORT}"
          echo "🌐 使用 mihomo 解析代理节点"
          # 下载 mihomo（MetaCubeX 的 clash-meta 分支，原生支持 ss+obfs 插件，无需外部 obfs-local）
          MIHOMO_VER="v1.18.10"
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-amd64-${MIHOMO_VER}.gz"
          if ! wget -q -T 30 "$MIHOMO_URL" -O mihomo.gz; then
            echo "⚠️ GitHub 下载失败，尝试镜像..."
            wget -q -T 30 "https://ghproxy.net/${MIHOMO_URL}" -O mihomo.gz
          fi
          gzip -dc mihomo.gz > mihomo 2>/dev/null || gunzip -f mihomo.gz
          chmod +x mihomo
          echo "📦 mihomo 版本: $(./mihomo -v | head -1)"
          # 解析 GOST_PROXY 生成 mihomo 配置（mixed 监听 127.0.0.1:1080）
          python3 parse_mihomo.py
          nohup ./mihomo -f mihomo_config.yaml > mihomo.log 2>&1 &
          sleep 5
          echo "📝 mihomo 启动日志:"
          tail -n 20 mihomo.log || true
          echo "✅ mihomo 已启动于 $LOCAL_MIXED"
          echo ""
          echo "🔍 自动遍历节点，寻找台湾住宅 IP..."
          # 获取所有节点名（排除 DIRECT/REJECT 等内置项）
          NODES=$(python3 -c "
          import json,urllib.request
          with urllib.request.urlopen('http://127.0.0.1:9090/proxies/GLOBAL') as r:
              d=json.load(r)
          for n in d.get('all',[]):
              if n not in ('DIRECT','REJECT','PASS','COMPATIBLE'):
                  print(n)
          ")
          SELECTED=""
          for node in $NODES; do
            # 切换到该节点
            curl -s -m 5 -X PUT "http://127.0.0.1:9090/proxies/GLOBAL" -d "{\"name\":\"$node\"}" >/dev/null 2>&1
            sleep 2
            # 检测出口 IP 性质
            ORG=$(curl -s -m 12 -x "$LOCAL_MIXED" "https://ipinfo.io/json" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('org','').lower())" 2>/dev/null)
            IP=$(curl -s -m 12 -x "$LOCAL_MIXED" "https://api.ipify.org" 2>/dev/null)
            if echo "$ORG" | grep -qiE "(hinet|chunghwa|as3462|data communication)"; then
              echo "✅ 住宅 IP 节点: $node → IP=$IP org=$ORG"
              SELECTED="$node"
              break
            else
              echo "⚠️ $node → IP=$IP org=$ORG（非住宅，跳过）"
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "⚠️ 未找到住宅 IP 节点，使用第一个台湾节点"
            FIRST=$(echo "$NODES" | head -1)
            curl -s -m 5 -X PUT "http://127.0.0.1:9090/proxies/GLOBAL" -d "{\"name\":\"$FIRST\"}" >/dev/null 2>&1
            SELECTED="$FIRST"
          fi
          echo "🎯 选定节点: $SELECTED"
          # 最终出口 IP 确认
          if OUT_IP=$(curl -s --connect-timeout 10 --max-time 15 -x "$LOCAL_MIXED" https://api.ipify.org); then
            echo "✅ 最终出口 IP: $(echo "$OUT_IP" | sed 's/\([0-9]*\.[0-9]*\.\)[0-9]*\.[0-9]*/\1**.**/g')"
          else
            echo "⚠️ 代理连通测试失败（上游节点可能已失效）"
            echo "⚠️ 不中止：续期脚本检测到代理不可用时自动回退直连"
          fi

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          ZAMPTO_ACCOUNT: ${{ secrets.ZAMPTO_ACCOUNT }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          TARGET_SERVERS: ${{ secrets.TARGET_SERVERS }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          ZAMPTO_APP_ID: ${{ secrets.ZAMPTO_APP_ID }}
          ZAMPTO_DOMAIN: ${{ secrets.ZAMPTO_DOMAIN }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python zampto_renew.py

      - name: 📸 上传调试截图和代理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.png
            mihomo.log
            mihomo_config.yaml
          retention-days: 3
