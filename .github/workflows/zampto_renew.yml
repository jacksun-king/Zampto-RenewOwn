name: Zampto-Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00

jobs:
  run_zampto_renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📂 检出仓库（脚本已在根目录）
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🛠️ 安装系统依赖（Ubuntu runner 已自带 Chrome）
        run: |
          # runner 已预装 google-chrome-stable，不再重复安装，避免卡在 Google 源
          # 换 Azure 镜像加速 apt，并设置超时避免卡死
          sudo bash -c 'source /etc/os-release && echo "deb http://azure.archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME} main restricted universe multiverse" > /etc/apt/sources.list'
          sudo bash -c 'source /etc/os-release && echo "deb http://azure.archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-updates main restricted universe multiverse" >> /etc/apt/sources.list'
          sudo bash -c 'source /etc/os-release && echo "deb http://azure.archive.ubuntu.com/ubuntu/ ${VERSION_CODENAME}-security main restricted universe multiverse" >> /etc/apt/sources.list'
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            xvfb \
            x11-utils \
            xdotool

      - name: ✅ 验证系统 Chrome
        run: |
          google-chrome --version
          which google-chrome

      - name: 💾 缓存 pip 包
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-seleniumbase-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-seleniumbase-

      - name: 🐍 安装 Python 依赖
        run: |
          pip install --cache-dir ~/.cache/pip -i https://pypi.tuna.tsinghua.edu.cn/simple seleniumbase requests[socks]
          seleniumbase install chromedriver || true

      - name: 🛡️ 启动代理转发（支持 GOST / Hysteria2 节点链接）
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          LOCAL_PROXY_PORT: "1080"
        run: |
          set -e
          PROXY="$GOST_PROXY"
          LOCAL_MIXED="socks5://127.0.0.1:${LOCAL_PROXY_PORT}"
          if [[ "$PROXY" == hysteria2://* ]] || [[ "$PROXY" == hy2://* ]]; then
            echo "🌐 检测到 Hysteria2 节点链接，使用 hysteria 客户端启动本地 SOCKS5"
            VER=$(curl -s https://api.github.com/repos/apernet/hysteria/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            echo "📦 Hysteria 版本: $VER"
            wget -q "https://github.com/apernet/hysteria/releases/download/${VER}/hysteria-linux-amd64"
            chmod +x hysteria-linux-amd64
            # 解析 hy2 链接生成配置
            cat > parse_hy2.py <<'PYEOF'
          import urllib.parse, json, os
          url = os.environ['GOST_PROXY']
          if url.startswith('hy2://'):
              url = 'hysteria2://' + url[6:]
          parsed = urllib.parse.urlparse(url)
          password, host_port = parsed.password, parsed.netloc
          if not host_port:
              host_port = parsed.path
          host, _, port = host_port.rpartition(':')
          port = int(port or 443)
          qs = urllib.parse.parse_qs(parsed.query)
          insecure = qs.get('insecure', ['0'])[0].lower() in ('1', 'true', 'yes')
          sni = qs.get('sni', [host])[0] or host
          alpn = qs.get('alpn', ['h3'])[0]
          obfs = qs.get('obfs', [''])[0]
          obfs_password = qs.get('obfs-password', [''])[0]
          auth = password if password else qs.get('auth', [''])[0]
          cfg = {
              "server": f"{host}:{port}",
              "auth": auth,
              "tls": {"sni": sni, "insecure": insecure},
              "quic": {"initStreamReceiveWindow": 8388608, "maxStreamReceiveWindow": 8388608,
                       "initConnReceiveWindow": 20971520, "maxConnReceiveWindow": 20971520},
              "socks5": {"listen": f"127.0.0.1:{os.environ['LOCAL_PROXY_PORT']}"}
          }
          if alpn:
              cfg["tls"]["alpn"] = alpn.split(',')
          if obfs:
              cfg["obfs"] = {"type": obfs}
              if obfs_password:
                  cfg["obfs"]["salamander"] = {"password": obfs_password}
          json.dump(cfg, open('hy2_config.json', 'w'), indent=2)
          print(json.dumps({k: (v if k != 'auth' else '***') for k, v in cfg.items()}, indent=2))
          PYEOF
            python3 parse_hy2.py
            echo "📝 hy2_config.json:"
            cat hy2_config.json
            nohup ./hysteria-linux-amd64 client -c hy2_config.json > hy2.log 2>&1 &
            sleep 5
            echo "📝 hysteria 启动日志前 50 行:"
            tail -n 50 hy2.log || true
            echo "✅ Hysteria2 客户端已启动于 $LOCAL_MIXED"
          else
            echo "🌐 使用 GOST 转发上游代理: $PROXY"
            VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
            echo "📦 GOST 版本: $VERSION"
            wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
            tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
            chmod +x gost
            nohup ./gost -L "mixed://:${LOCAL_PROXY_PORT}" -F "$PROXY" > gost.log 2>&1 &
            sleep 3
            echo "📝 gost 启动日志:"
            cat gost.log || true
            echo "✅ GOST 已启动于 $LOCAL_MIXED"
          fi
          echo "✅ 代理就绪，测试出口 IP..."
          curl -s --connect-timeout 10 -x "$LOCAL_MIXED" https://api.ipify.org | sed 's/\([0-9]*\.[0-9]*\.\)[0-9]*\.[0-9]*/\1**.**/g' && echo "" || (echo "⚠️ 代理连通测试失败"; exit 1)

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          ZAMPTO_ACCOUNT: ${{ secrets.ZAMPTO_ACCOUNT }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          TARGET_SERVERS: ${{ secrets.TARGET_SERVERS }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          ZAMPTO_APP_ID: ${{ secrets.ZAMPTO_APP_ID }}
          ZAMPTO_DOMAIN: ${{ secrets.ZAMPTO_DOMAIN }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python zampto_renew.py

      - name: 📸 上传调试截图和代理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.png
            hy2.log
            gost.log
            hy2_config.json
          retention-days: 3
